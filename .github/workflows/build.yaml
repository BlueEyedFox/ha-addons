name: Build add-ons

on:
  push:
    branches: [main]
    paths:
      - "*/config.yaml"
      - "*/Dockerfile"
      - "*/run.sh"
      - "*/rootfs/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        addon: [onedev]
        arch: [amd64]
    steps:
      - uses: actions/checkout@v4

      - name: Read add-on version
        id: info
        run: |
          version=$(yq -r '.version' "${{ matrix.addon }}/config.yaml")
          image=$(yq -r '.image' "${{ matrix.addon }}/config.yaml" | sed "s/{arch}/${{ matrix.arch }}/")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=${image,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.addon }}
          platforms: linux/${{ matrix.arch }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.info.outputs.image }}:${{ steps.info.outputs.version }}
            ${{ steps.info.outputs.image }}:latest
          labels: |
            io.hass.version=${{ steps.info.outputs.version }}
            io.hass.type=addon
            io.hass.arch=${{ matrix.arch }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.addon }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.addon }}-${{ matrix.arch }}
