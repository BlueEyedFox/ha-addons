name: Build add-ons

on:
  push:
    branches: [main]
    paths:
      - "*/config.yaml"
      - "*/Dockerfile"
      - "*/run.sh"
      - "*/smoke-test.sh"
      - "*/rootfs/**"
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      addons:
        description: JSON list of add-on slugs to build
        type: string
        required: true
      ref:
        description: Git ref to build from
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        addon: ${{ fromJSON(inputs.addons || '["onedev","heimdall","ortsnetz-sma"]') }}
        arch: [amd64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Read add-on version
        id: info
        run: |
          version=$(yq -r '.version' "${{ matrix.addon }}/config.yaml")
          image=$(yq -r '.image' "${{ matrix.addon }}/config.yaml" | sed "s/{arch}/${{ matrix.arch }}/")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=${image,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.addon }}
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ${{ matrix.addon }}:test
          cache-from: type=gha,scope=${{ matrix.addon }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.addon }}-${{ matrix.arch }}

      - name: Smoke test
        run: |
          if [ -x "${{ matrix.addon }}/smoke-test.sh" ]; then
            "${{ matrix.addon }}/smoke-test.sh" "${{ matrix.addon }}:test"
          else
            echo "No smoke test for ${{ matrix.addon }}"
          fi

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.addon }}
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: |
            ${{ steps.info.outputs.image }}:${{ steps.info.outputs.version }}
            ${{ steps.info.outputs.image }}:latest
          labels: |
            io.hass.version=${{ steps.info.outputs.version }}
            io.hass.type=addon
            io.hass.arch=${{ matrix.arch }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.addon }}-${{ matrix.arch }}
