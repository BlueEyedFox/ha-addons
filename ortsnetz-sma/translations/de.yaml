configuration:
  latitude:
    name: Breitengrad
    description: "Breitengrad des Messorts, z. B. 52.520008. Leer lassen für den Standort aus Home Assistant."
  longitude:
    name: Längengrad
    description: "Längengrad des Messorts, z. B. 13.404954. Leer lassen für den Standort aus Home Assistant."
  interface_ip:
    name: Interface-IP
    description: "IP des Home-Assistant-Hosts im Netz des Zählers. 0.0.0.0 = Standard-Interface."
  meter_serial:
    name: Zähler-Seriennummer
    description: Nur nötig, wenn mehrere SMA-Zähler im Netz senden. Steht im Log des Testmodus.
  send_grid_power:
    name: Netzleistung senden
    description: "Wirkleistung am Hausanschluss aus den Zähler-Telegrammen senden (Mittelwert über 5 Minuten). Ausschalten, wenn der Zähler nicht am Hausanschluss sitzt, z. B. Energy Meter am Wechselrichter."
  plant_capacity_kwp:
    name: PV-Anlagengröße (kWp)
    description: Installierte PV-Leistung. Wird nach dem Start einmal gesendet und ist für die PV-Prognose nötig.
  battery_capacity_kwh:
    name: Batteriekapazität (kWh)
    description: Nutzbare Kapazität des Batteriespeichers. Wird nach dem Start einmal gesendet.
  battery_soc_entity:
    name: Entität Batterie-Ladezustand
    description: "Sensor mit dem Ladezustand in %, z. B. sensor.battery_soc."
  pv_forecast_entity:
    name: Entität PV-Prognose heute
    description: "Sensor mit der heutigen PV-Prognose in Wh, kWh oder MWh, z. B. sensor.energy_production_today."
  dry_run:
    name: Testmodus
    description: Messwerte nur im Log anzeigen und nichts senden.
