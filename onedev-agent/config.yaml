name: OneDev Agent
version: "4.1.5"
slug: onedev-agent
description: Build agent for OneDev that runs CI/CD jobs in Docker on the Home Assistant host
url: https://github.com/BlueEyedFox/ha-addons/tree/main/onedev-agent
arch:
  - amd64
image: ghcr.io/blueeyedfox/ha-addon-onedev-agent-{arch}
init: false
startup: application
boot: auto
docker_api: true
# The agent finds its host path by looking for a mount at exactly /agent/work,
# so the add-on config folder is mounted there instead of using /data.
map:
  - type: addon_config
    path: /agent/work
    read_only: false
  - type: ssl
    read_only: true
backup_exclude:
  - "*"
options:
  server_url: ""
  agent_token: ""
  attributes: []
  max_memory_percent: 50
  trust_certs: []
schema:
  server_url: url
  agent_token: password
  agent_name: str?
  attributes:
    - name: match(^[A-Za-z0-9_.-]+$)
      value: str
  max_memory_percent: int(10,90)
  trust_certs:
    - str
  http_proxy: str?
  https_proxy: str?
  no_proxy: str?
